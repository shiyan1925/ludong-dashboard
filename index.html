function fmt(x, sign) { return x === null || x === undefined ? "—" : (sign && x > 0 ? "+" : "") + x.toFixed(2) + "%"; }
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
const C = { p:"#1E40AF", s:"#3B82F6", a:"#D97706", bd:"#DBEAFE", bg:"#F8FAFC" };
function ech(dom) { const c = echarts.init(dom); return c; }
document.getElementById("asof").textContent = DATA.as_of;
// KPI
const kpis = [
  ["本月销量", DATA.sales_now, "订交比 " + (DATA.ratio ?? "—")],
  ["销量环比", fmt(DATA.sales_qoq, true), "较上月同期"],
  ["本月订单", DATA.orders_now, "订单环比 " + fmt(DATA.orders_qoq, true)],
  ["大唐EV已订", DATA.da_done, "目标 " + DATA.da_goal],
  ["大唐完成率", fmt(DATA.da_rate), "差额 " + DATA.da_diff],
];
document.getElementById("kpis").innerHTML = kpis.map(k => `<div class="kpi"><div class="t">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join("");
// 趋势
(function() {
  const c = ech(document.getElementById("ch-trend"));
  c.setOption({
    grid: { left: 40, right: 12, top: 30, bottom: 24 },
    tooltip: { trigger: "axis" },
    xAxis: { type: "category", data: DATA.daily.map(d => d.d) },
    yAxis: { type: "value", splitLine: { lineStyle: { color: C.bd } } },
    series: [
      { name: "销量", type: "line", smooth: true, data: DATA.daily.map(d => d.sales), itemStyle: { color: C.p }, label: { show: true, fontSize: 10 } },
      { name: "订单", type: "line", smooth: true, data: DATA.daily.map(d => d.orders), itemStyle: { color: C.a }, label: { show: true, fontSize: 10 } },
    ]
  });
})();
// 集团
(function() {
  const c = ech(document.getElementById("ch-group"));
  c.setOption({
    grid: { left: 70, right: 16, top: 20, bottom: 20 },
    xAxis: { type: "value", splitLine: { lineStyle: { color: C.bd } } },
    yAxis: { type: "category", data: DATA.groups.map(g => g.name) },
    series: [{ type: "bar", data: DATA.groups.map(g => g.now), itemStyle: { color: C.s }, label: { show: true, position: "right", fontSize: 10 } }]
  });
})();
// 大唐表
function datangTable(dom, data) {
  let h = "<table><tr><th>层级</th><th>名称</th><th>目标</th><th>已订</th><th>完成率</th><th>差额</th></tr>";
  h += data.map(r => `<tr><td>${esc(r["层级"])}</td><td>${esc(r["名称"])}</td><td>${r["目标"]}</td><td>${r["已订"]}</td><td>${fmt(r["完成率"])}</td><td>${r["差额"]}</td></tr>`).join("");
  dom.innerHTML = h + "</table>";
}

// 对比表（含筛选）
function cmpTable(dom, rows) {
  let h = "<table><tr><th>区域</th><th>城市</th><th>集团</th><th>渠道</th><th>经销商</th><th>本期</th><th>同期</th><th>环比</th></tr>";
  h += rows.map(r => `<tr><td>${esc(r["区域"])||"—"}</td><td>${esc(r["城市"])||"—"}</td><td>${esc(r["集团"])||"—"}</td><td>${esc(r["渠道"])||"—"}</td><td>${esc(r["dealer"])}</td><td>${r["now"]}</td><td>${r["prev"]}</td><td>${fmt(r["qoq"], true)}</td></tr>`).join("");
  dom.innerHTML = h + "</table>";
}
// 筛选状态
const S = { region: "全部", city: "全部", group: "全部", channel: "全部" };
function fRows(rows) {
  return rows.filter(r =>
    (S.region === "全部" || r["区域"] === S.region) &&
    (S.city === "全部" || r["城市"] === S.city) &&
    (S.group === "全部" || r["集团"] === S.group) &&
    (S.channel === "全部" || r["渠道"] === S.channel));
}
function fDatang(rows) {
  return rows.filter(r =>
    (S.region === "全部" || !r["归属区域"] || r["归属区域"] === S.region) &&
    (S.city === "全部" || !r["归属城市"] || r["归属城市"] === S.city) &&
    (S.group === "全部" || !r["归属集团"] || r["归属集团"] === S.group));
}
function renderTables() {
  cmpTable(document.getElementById("t-sales-m"), fRows(DATA.sales_month));
  cmpTable(document.getElementById("t-sales-w"), fRows(DATA.sales_week));
  cmpTable(document.getElementById("t-orders-m"), fRows(DATA.orders_month));
  cmpTable(document.getElementById("t-orders-w"), fRows(DATA.orders_week));
  datangTable(document.getElementById("t-datang"), fDatang(DATA.datang));
  datangTable(document.getElementById("t-datang2"), fDatang(DATA.datang));
}
function fillSel(id, vals) {
  const sel = document.getElementById(id);
  vals.forEach(v => { const o = document.createElement("option"); o.value = v; o.text = v; sel.appendChild(o); });
}
fillSel("f-region", DATA.dims.regions);
fillSel("f-city", DATA.dims.cities);
fillSel("f-group", DATA.dims.groups);
fillSel("f-channel", DATA.dims.channels);
document.getElementById("f-region").onchange = e => { S.region = e.target.value; renderTables(); };
document.getElementById("f-city").onchange = e => { S.city = e.target.value; renderTables(); };
document.getElementById("f-group").onchange = e => { S.group = e.target.value; renderTables(); };
document.getElementById("f-channel").onchange = e => { S.channel = e.target.value; renderTables(); };
renderTables();   // 初始渲染
// 车系分布
function seriesChart(dom, rows, color) {
  const c = ech(dom);
  c.setOption({
    grid: { left: 80, right: 30, top: 16, bottom: 24 },
    xAxis: { type: "value", splitLine: { lineStyle: { color: C.bd } } },
    yAxis: { type: "category", data: rows.map(r => r.name) },
    series: [{ type: "bar", data: rows.map(r => r.n), itemStyle: { color }, label: { show: true, position: "right", fontSize: 10, formatter: p => p.value + " (" + rows[p.dataIndex].pct + "%)" } }]
  });
}
seriesChart(document.getElementById("ch-series-s"), DATA.series_sales, C.s);
seriesChart(document.getElementById("ch-series-o"), DATA.series_orders, C.a);
// 原始明细（管理端）
// 导航
document.querySelectorAll(".nav").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + b.dataset.v));
});
window.addEventListener("resize", () => { document.querySelectorAll(".chart").forEach(c => echarts.getInstanceByDom(c)?.resize()); });
</script>
</body>
</html>
